<!doctype html><html><head><meta charset="utf-8"><title>Game harness</title>
<style>
:root{--panel:#100e0b;--line:#2a251d;--gold:#d6b26e;--cream:#f1e9db;--muted:#a59d90;--neon:#ff3d7f;--cyan:#3de0ff;--ok:#56d68b;--display:"Bodoni Moda",Georgia,serif;--body:Manrope,Arial,sans-serif;--mono:ui-monospace,monospace}
body{margin:0;background:#000;color:var(--cream);font-family:var(--body)}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111}
.card{background:var(--panel);border:1px solid var(--line);padding:26px 28px;width:min(520px,100%);box-sizing:border-box;max-height:90vh;overflow:auto}
.card.wide{width:min(900px,100%)}
.card canvas.game{display:block;width:100%;height:auto;background:#05060a;border:1px solid var(--line);touch-action:none}
.card h2{font-family:var(--display);font-weight:500;font-size:30px;margin:0 0 4px}.card h2 em{color:var(--gold)}
.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.card p{color:var(--muted);line-height:1.6;font-size:14px;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
button{background:transparent;color:var(--cream);border:1px solid var(--line);padding:9px 16px;font:600 13px var(--body);cursor:pointer}
button.primary{background:var(--gold);color:#17120a;border-color:var(--gold)}
.result{font-size:14px;color:var(--cream);margin-top:12px}.note{font-size:12px!important}
#log{position:fixed;bottom:0;left:0;font:11px monospace;color:#7f7}
</style></head><body>
<div class="modal"><div class="card" id="panelCard"></div></div><div id="log"></div>
<script type="module">
// Standalone harness: games/_harness.html?g=<name>
const card = document.getElementById('panelCard'); let chips = 10000; const cleanups = [];
const log = (m) => { document.getElementById('log').textContent = m; console.log('[harness]', m); };
const api = {
  open: (html, o = {}) => { while (cleanups.length) cleanups.pop()(); card.classList.toggle('wide', !!o.wide); card.innerHTML = html; card.querySelectorAll('[data-close]').forEach((b) => b.onclick = api.close); return card; },
  close: () => { while (cleanups.length) cleanups.pop()(); card.innerHTML = '<p>closed</p>'; log('closed'); },
  onClose: (f) => cleanups.push(f), chips: () => chips, addChips: (d) => { chips = Math.max(0, chips + d); log('chips ' + chips); },
  toast: (m) => log('toast: ' + m), broadcast: (t) => log('broadcast: ' + t), playerName: () => 'Pax', playerColor: () => '#d6b26e', mirror: () => {},
};
window.__api = api;
const g = new URLSearchParams(location.search).get('g');
import(`./${g}.js`).then((m) => m.default(api, {})).catch((e) => { log('LOAD ERROR ' + e.message); console.error(e); });
window.addEventListener('error', (e) => log('ERROR ' + e.message));
</script></body></html>
